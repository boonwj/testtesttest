name: Monthly Chores Issue

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create monthly chores issue
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const year = now.getUTCFullYear();
            const month = String(now.getUTCMonth() + 1).padStart(2, '0');
            const label = `${year}-${month}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Monthly Chores - ${label}`,
              body: [
                'Chores for the month.',
                '',
                '- [ ] Update CDO List',
                '- [ ] Update VM patch count',
                "- [ ] Compute last month's downtime",
                '- [ ] Update firewall with gitsir blocklist',
                '- [ ] ABLR log review - [Link](https://self-service.gcsoc.tech.gov.sg/)',
              ].join('\n'),
            });
